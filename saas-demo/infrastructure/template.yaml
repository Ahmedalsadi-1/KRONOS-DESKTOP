AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Multi-tenant SaaS demo infrastructure

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs18.x
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref SaasDemoTable

Resources:
  # DynamoDB Table with tenant isolation
  SaasDemoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: saas-demo-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Lambda Authorizer
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/authorizer/
      Handler: index.handler
      Description: JWT authorizer with tenant context injection

  # Users API Function
  UsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/api/
      Handler: users.handler
      Description: Multi-tenant users API
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SaasDemoTable
        - EventBridgePutEventsPolicy:
            EventBusName: default
      Events:
        GetUsers:
          Type: Api
          Properties:
            RestApiId: !Ref SaasApi
            Path: /users
            Method: get
            Auth:
              Authorizer: TokenAuthorizer
        CreateUser:
          Type: Api
          Properties:
            RestApiId: !Ref SaasApi
            Path: /users
            Method: post
            Auth:
              Authorizer: TokenAuthorizer
        GetUser:
          Type: Api
          Properties:
            RestApiId: !Ref SaasApi
            Path: /users/{userId}
            Method: get
            Auth:
              Authorizer: TokenAuthorizer

  # API Gateway
  SaasApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        Authorizers:
          TokenAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            Identity:
              Header: Authorization
              ValidationExpression: "^Bearer [-0-9A-Za-z\\.]+$"
              ReauthorizeEvery: 300

  # EventBridge Rule for Usage Tracking
  UsageTrackingRule:
    Type: AWS::Events::Rule
    Properties:
      Description: "Route usage events to billing system"
      EventPattern:
        source: ["saas-demo.users"]
        detail-type: ["Usage Event"]
      State: ENABLED
      Targets:
        - Arn: !GetAtt UsageTrackingFunction.Arn
          Id: "UsageTrackingTarget"

  # Usage Tracking Function
  UsageTrackingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/billing/
      Handler: usage-tracking.handler
      Description: Process usage events for billing
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SaasDemoTable

  # Permission for EventBridge to invoke Lambda
  UsageTrackingPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UsageTrackingFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt UsageTrackingRule.Arn

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${SaasApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
    Export:
      Name: SaasDemoApiUrl

  TableName:
    Description: "DynamoDB table name"
    Value: !Ref SaasDemoTable
    Export:
      Name: SaasDemoTableName