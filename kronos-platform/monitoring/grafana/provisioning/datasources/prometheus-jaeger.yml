apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://kronos-monitoring:9090
    isDefault: true
    editable: true

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    database: loki

dashboards:
  - name: KRONOS Distributed Tracing Overview
    type: file
    path: /etc/grafana/provisioning/dashboards/kronos-tracing-overview.json
    disable_deletion: false
    overwrite: true

  - name: KRONOS Service Performance
    type: file
    path: /etc/grafana/provisioning/dashboards/kronos-service-performance.json
    disable_deletion: false
    overwrite: true

  - name: KRONOS System Health
    type: file
    path: /etc/grafana/provisioning/dashboards/kronos-system-health.json
    disable_deletion: false
    overwrite: true

  - name: Jaeger Trace Analysis
    type: file
    path: /etc/grafana/provisioning/dashboards/jaeger-trace-analysis.json
    disable_deletion: false
    overwrite: true