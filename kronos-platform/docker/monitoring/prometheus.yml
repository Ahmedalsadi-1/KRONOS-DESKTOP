global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'kronos-service-registry'
    static_configs:
      - targets: ['docker-kronos-service-registry-1:8080']
    metrics_path: '/health'
    params:
      format: ['prometheus']

  - job_name: 'kronos-api-gateway'
    static_configs:
      - targets: ['docker-kronos-api-gateway-1:3000']
    metrics_path: '/health'
    params:
      format: ['prometheus']

  - job_name: 'kronos-config-service'
    static_configs:
      - targets: ['docker-kronos-config-service-1:4000']
    metrics_path: '/health'
    params:
      format: ['prometheus']

  - job_name: 'kronos-redis'
    static_configs:
      - targets: ['docker-kronos-redis-1:6379']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']